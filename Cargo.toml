[package]
name = "tokmesh-lite"
version = "0.1.0"
edition = "2024"
description = "Validate data-product manifests and CSV datasets from the command line"
license = "MIT"
repository = "https://github.com/theAfricanQuant/tokmesh-lite"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
