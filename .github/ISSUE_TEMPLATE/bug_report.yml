name: Bug report
description: Report incorrect validation or CLI behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach sensitive or regulated data. Create the smallest synthetic example that reproduces the problem.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and synthetic manifest/data needed to reproduce it.
    validations:
      required: true

